name: ProXPL Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: proxpl-linux-x86_64
            binary_path: build/proxpl
            is_unix: true
          - os: windows-latest
            artifact_name: proxpl-windows-x86_64
            binary_path: build\Release\proxpl.exe
            is_unix: false
          - os: macos-latest
            artifact_name: proxpl-macos-arm64
            binary_path: build/proxpl
            is_unix: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install LLVM (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      - name: Install LLVM (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm
          echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm)" >> $GITHUB_ENV

      - name: Install LLVM (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/setup_llvm_windows.ps1

      - name: Configure (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cmake -S . -B build `
             -DCMAKE_BUILD_TYPE=Release `
             -DLLVM_DIR="$env:LLVM_DIR" `
             -DCMAKE_PREFIX_PATH="$env:LLVM_ROOT"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --verbose

      - name: Verify Build (Check Binary Exists)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            if [ -f "build/Release/proxpl.exe" ] || [ -f "build/proxpl.exe" ]; then
              echo "Windows binary found"
            else
              echo "Windows binary NOT found"
              ls -R build
              exit 1
            fi
          else
            if [ -f "${{ matrix.binary_path }}" ]; then
              echo "Binary found at ${{ matrix.binary_path }}"
            else
              echo "Binary NOT found at ${{ matrix.binary_path }}"
              ls -R build
              exit 1
            fi
          fi

      - name: Build Installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y
          New-Item -ItemType Directory -Force -Path bin
          $binDir = if (Test-Path "build/Release/proxpl.exe") { "build/Release" } else { "build" }
          Copy-Item "$binDir/proxpl.exe" -Destination "bin/"
          Copy-Item "$binDir/prm.exe" -Destination "bin/"
          if (Test-Path "$binDir/proxpl_lib.dll") {
            Copy-Item "$binDir/proxpl_lib.dll" -Destination "bin/"
          }
          ISCC setup.iss
          Get-ChildItem -Path build

      - name: Extract Version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "VERSION=dev" >> $GITHUB_ENV
          fi

      - name: Run Smoke Tests
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            BIN_PATH="build/Release/proxpl.exe"
            if [ ! -f "$BIN_PATH" ]; then BIN_PATH="build/proxpl.exe"; fi
            $BIN_PATH --version
          else
            chmod +x "${{ matrix.binary_path }}"
            ${{ matrix.binary_path }} --version
          fi

      - name: Package Artifact (Unix)
        if: matrix.is_unix
        shell: bash
        run: |
          ARCHIVE="proxpl-${VERSION}-${{ matrix.artifact_name }}.tar.gz"
          mkdir -p release_pkg
          cp "${{ matrix.binary_path }}" release_pkg/proxpl
          cp LICENSE README.md release_pkg/ 2>/dev/null || true
          tar -czvf "$ARCHIVE" -C release_pkg .
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "ASSET_NAME=$ARCHIVE" >> $GITHUB_ENV

      - name: Package Artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $Archive = "proxpl-${env:VERSION}-${{ matrix.artifact_name }}.zip"
          New-Item -ItemType Directory -Force -Path release_pkg
          $BinPath = if (Test-Path "build/Release/proxpl.exe") { "build/Release/proxpl.exe" } else { "build/proxpl.exe" }
          Copy-Item $BinPath -Destination release_pkg/
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination release_pkg/ }
          if (Test-Path README.md) { Copy-Item README.md -Destination release_pkg/ }
          Compress-Archive -Path release_pkg/* -DestinationPath $Archive
          $Hash = (Get-FileHash $Archive -Algorithm SHA256).Hash.ToLower()
          "$Hash  $Archive" | Out-File -FilePath "${Archive}.sha256" -Encoding ASCII
          echo "ASSET_NAME=$Archive" >> $env:GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ env.ASSET_NAME }}
            ${{ env.ASSET_NAME }}.sha256
            build/ProXPL_Installer_*.exe

  release:
    name: Create Release
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: proxpl-windows-x86_64
          path: .
          merge-multiple: true
          
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: proxpl-linux-x86_64
          path: .
          merge-multiple: true

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: proxpl-macos-arm64
          path: .
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
            ProXPL_Installer_*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
