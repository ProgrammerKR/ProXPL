name: ProXPL CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            bin_path: |
              build/proxpl
              build/prm
          - os: macos-latest
            bin_path: |
              build/proxpl
              build/prm
          - os: windows-latest
            bin_path: build/ProXPL_Installer_*.exe
            
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Install LLVM (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang

      - name: Install LLVM (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm
          echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm)" >> $GITHUB_ENV

      - name: Set up LLVM (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/setup_llvm_windows.ps1

      - name: Configure (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCH=OFF

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "LLVM_DIR is: $env:LLVM_DIR"
          Write-Host "LLVM_ROOT is: $env:LLVM_ROOT"
          Write-Host "CMAKE_PREFIX_PATH is: $env:CMAKE_PREFIX_PATH"
          cmake -S . -B build `
             -DLLVM_DIR="$env:LLVM_DIR" `
             -DCMAKE_PREFIX_PATH="$env:LLVM_ROOT" `
             -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
             -DBUILD_TESTS=ON `
             -DBUILD_BENCH=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release --verbose

      - name: Run Tests
        shell: bash
        run: |
          cd build
          ctest -C Release --output-on-failure

      - name: Run Benchmarks
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            EXE_PATH="build/Release/proxpl.exe"
            if [ ! -f "$EXE_PATH" ]; then
              EXE_PATH="build/proxpl.exe"
            fi
          else
            EXE_PATH="build/proxpl"
          fi
          
          echo "Running benchmarks with $EXE_PATH"
          python benchmarks/run_benchmarks.py --executable "$EXE_PATH"

      - name: Build Installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y
          New-Item -ItemType Directory -Force -Path bin
          $binDir = if (Test-Path "build/Release/proxpl.exe") { "build/Release" } else { "build" }
          Copy-Item "$binDir/proxpl.exe" -Destination "bin/"
          Copy-Item "$binDir/prm.exe" -Destination "bin/"
          Get-ChildItem "$binDir/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "bin/"
          iscc setup.iss

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProXPL-v1.2.0-${{ matrix.os }}
          path: |
            ${{ matrix.bin_path }}
            examples/
